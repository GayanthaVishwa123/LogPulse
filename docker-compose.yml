services:
  postgres:
    image: postgres:15
    container_name: logpulse-postgres
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: logpulse-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./logpulse_backend/scripts/services/auth-service
      dockerfile: Dockerfile
    container_name: logpulse-auth-service
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://auth_user:password@postgres:5432/auth_db
    env_file:
      - .env.example
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy

  processor-service:
    build:
      context: ./logpulse_backend/scripts/services/processor-service
      dockerfile: Dockerfile
    container_name: logpulse-processor-service
    environment:
      - PYTHONPATH=/app
      - BROKER_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env.example
    ports:
      - '8001:8001'
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./logpulse_backend/scripts/services/processor-service
      dockerfile: Dockerfile
    container_name: logpulse-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - PYTHONPATH=/app
      - BROKER_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env.example
    depends_on:
      redis:
        condition: service_healthy
      processor-service:
        condition: service_started

volumes:
  postgres_data: