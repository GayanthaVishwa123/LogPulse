name: Auth Service CI

on:
  push:
    paths:
      - ".github/workflows/auth-service-ci.yml"
      - "logpulse_backend/scripts/services/auth-service/**"
      - "!logpulse_backend/scripts/services/auth-service/README.md"
  pull_request:
    paths:
      - ".github/workflows/auth-service-ci.yml"
      - "logpulse_backend/scripts/services/auth-service/**"
      - "!logpulse_backend/scripts/services/auth-service/README.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # ⚡ Repeat builds fast dependencies cache
          cache-dependency-path: "logpulse_backend/scripts/services/auth-service/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/logpulse_backend/scripts/services/auth-service/requirements.txt"
      - name: Run tests
        run: |
          cd "$GITHUB_WORKSPACE/logpulse_backend/scripts/services/auth-service"
          python3 -m pytest
      - name: Build Docker image
        run: |
          docker build -t auth-service:ci "$GITHUB_WORKSPACE/logpulse_backend/scripts/services/auth-service"
