name: Processor Service CI

on:
  push:
    paths:
      - "services/processor-service/**"
  pull_request:
    paths:
      - "services/processor-service/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/processor-service/requirements.txt
      - name: Run tests
        run: |
          cd services/processor-service
          pytest
      - name: Build Docker image
        run: |
          docker build -t processor-service:ci ./services/processor-service
