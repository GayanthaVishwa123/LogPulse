name: Processor Service CI

on:
  push:
    paths:
      - ".github/workflows/processor-service-ci.yml"
      - "logpulse_backend/scripts/services/processor-service/**"
      - "!logpulse_backend/scripts/services/processor-service/README.md"
  pull_request:
    paths:
      - ".github/workflows/processor-service-ci.yml"
      - "logpulse_backend/scripts/services/processor-service/**"
      - "!logpulse_backend/scripts/services/processor-service/README.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/logpulse_backend/scripts/services/processor-service/requirements.txt"
      - name: Run tests
        run: |
          cd "$GITHUB_WORKSPACE/logpulse_backend/scripts/services/processor-service"
          python3 -m pytest tests
      - name: Build Docker image
        run: |
          docker build -t processor-service:ci "$GITHUB_WORKSPACE/logpulse_backend/scripts/services/processor-service"
